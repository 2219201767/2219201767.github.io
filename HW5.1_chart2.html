<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    #vis.vega-embed {
      width: 100%;
      display: flex;
    }

    #vis.vega-embed details,
    #vis.vega-embed details summary {
      position: relative;
    }
  </style>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-lite@5.20.1"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    (function(vegaEmbed) {
      var spec = {"config": {"view": {"continuousWidth": 300, "continuousHeight": 300}}, "data": {"name": "data-08a6a309cdc170f90357b7c40b892328"}, "mark": {"type": "bar"}, "encoding": {"color": {"field": "season", "legend": null, "scale": {"domain": ["Spring", "Summer", "Fall", "Winter"], "range": ["#66A61E", "#E6AB02", "#D95F02", "#7570B3"]}, "type": "nominal"}, "tooltip": [{"field": "season", "title": "Season", "type": "nominal"}, {"field": "count", "title": "Reports", "type": "quantitative"}], "x": {"field": "season", "sort": ["Spring", "Summer", "Fall", "Winter"], "title": "Season", "type": "nominal"}, "y": {"field": "count", "title": "Number of Reports", "type": "quantitative"}}, "height": 350, "title": "Bigfoot Sightings by Season", "width": 500, "$schema": "https://vega.github.io/schema/vega-lite/v5.20.1.json", "datasets": {"data-08a6a309cdc170f90357b7c40b892328": [{"season": "Fall", "count": 1413}, {"season": "Spring", "count": 767}, {"season": "Summer", "count": 1765}, {"season": "Winter", "count": 711}]}};
      var embedOpt = {"mode": "vega-lite"};

      function showError(el, error){
          el.innerHTML = ('<div style="color:red;">'
                          + '<p>JavaScript Error: ' + error.message + '</p>'
                          + "<p>This usually means there's a typo in your chart specification. "
                          + "See the javascript console for the full traceback.</p>"
                          + '</div>');
          throw error;
      }
      const el = document.getElementById('vis');
      vegaEmbed("#vis", spec, embedOpt)
        .catch(error => showError(el, error));
    })(vegaEmbed);

  </script>
</body>
</html>
